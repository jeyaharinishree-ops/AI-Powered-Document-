<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Lens - AI resume analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--panel:#0f2a2e;--panel2:#173b40;--ink:#12272a;--mute:#5d7376;--card:#fff;--line:#d5dfde;--accent:#e8a317;--ok:#1f9d6b;--bad:#c8553d}
*{box-sizing:border-box}
body{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:340px 1fr;min-height:100vh}
aside{background:var(--panel);color:#e6f0ef;padding:28px 24px;position:sticky;top:0;height:100vh;overflow:auto}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.5px}
aside p.sub{color:#9bb5b7;font-size:14px;margin:0 0 24px}
label{display:block;font-size:13px;color:#9bb5b7;margin:16px 0 6px}
.drop{border:1.5px dashed #4d7a7f;border-radius:10px;padding:18px;text-align:center;cursor:pointer;font-size:14px;background:var(--panel2)}
.drop.over,.drop:focus-visible{border-color:var(--accent);outline:none}
textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #3b6469;background:var(--panel2);color:#fff;font:inherit;resize:vertical}
mark{background:#ffe08a;border-radius:3px;padding:0 2px}
.src{white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:320px;overflow:auto;background:#f6f9f8;padding:12px;border-radius:8px}
.dl{background:var(--panel);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;margin-bottom:16px}
select,input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid #3b6469;background:var(--panel2);color:#fff;font:inherit}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid #3b6469;background:transparent;color:#cfe0e0;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#2b1d00;font-weight:700}
.go{margin-top:24px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#2b1d00;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{padding:32px;max-width:1000px}
.empty{color:var(--mute);margin-top:80px;max-width:420px}
.err{background:#fbe9e5;border:1px solid var(--bad);color:#7a2b1a;padding:12px 16px;border-radius:10px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:230px 1fr;gap:20px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-size:17px;margin:0 0 12px}
.ring{text-align:center}
.ring svg{width:170px;height:170px}
.chk{list-style:none;padding:0;margin:12px 0 0;text-align:left;font-size:14px}
.chk li{display:flex;justify-content:space-between;padding:3px 0}
.yes{color:var(--ok)}.no{color:var(--bad)}
.summary{white-space:pre-wrap;line-height:1.6}
.chip{display:inline-block;padding:4px 10px;margin:3px 4px 3px 0;border-radius:99px;background:#e1ece9;font-size:13px}
.null{color:var(--bad);font-style:italic}
.row{display:grid;grid-template-columns:110px 1fr;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}.row b{color:var(--mute);font-weight:500}
.bar{display:grid;grid-template-columns:130px 1fr 28px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--panel);transform-origin:left;animation:g .7s ease-out}
@keyframes g{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
.note{background:#fff6e0;border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:10px}
ul.f{padding-left:18px;line-height:1.6;margin:0}
@media(max-width:860px){body{grid-template-columns:1fr}aside{position:static;height:auto}.grid{grid-template-columns:1fr}main{padding:20px}}
</style>
</head>
<body>
<aside>
  <h1>Resume Lens</h1>
  <p class="sub">Upload a resume. Get a grounded summary, structured data and a skills map.</p>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose resume file">
    <span id="dropText">Drop a PDF or TXT here, or click to browse</span>
    <input type="file" id="file" accept=".pdf,.txt" hidden>
  </div>
  <label for="sample">Or try a sample</label>
  <select id="sample"><option value="">None</option></select>
  <label>Analysis level</label>
  <div class="seg" id="level"><button data-v="basic">Basic</button><button data-v="standard" class="on">Standard</button><button data-v="detailed">Detailed</button></div>
  <label>Summary style</label>
  <div class="seg" id="style"><button data-v="brief" class="on">Brief</button><button data-v="detailed">Detailed</button><button data-v="bullets">Bullets</button></div>
  <label for="focus">Focus on (optional, comma separated)</label>
  <input type="text" id="focus" placeholder="e.g. Python, leadership, projects">
  <label for="jd">Job description (optional, enables job match)</label>
  <textarea id="jd" rows="4" placeholder="Paste a job description..."></textarea>
  <button class="go" id="go">Analyze resume</button>
</aside>
<main id="out"><div class="empty"><h2>No analysis yet</h2>Choose a file or a sample on the left, pick how deep you want the analysis, then select Analyze resume.</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let chosen=null;const opt={level:'standard',style:'brief'};
fetch('/api/samples').then(r=>r.json()).then(l=>l.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('sample').appendChild(o)}));
['level','style'].forEach(g=>$(g).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  [...$(g).children].forEach(x=>x.classList.remove('on'));b.classList.add('on');opt[g]=b.dataset.v}));
const setFile=f=>{chosen=f;$('sample').value='';$('dropText').textContent=f?f.name:'Drop a PDF or TXT here, or click to browse'};
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('file').click()};
$('file').onchange=e=>setFile(e.target.files[0]);
['dragover','dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.toggle('over',ev==='dragover');if(ev==='drop')setFile(e.dataTransfer.files[0])}));
$('sample').onchange=()=>{if($('sample').value)setFile(null);};
$('go').onclick=async()=>{
  const fd=new FormData();
  if(chosen)fd.append('file',chosen);else if($('sample').value)fd.append('sample',$('sample').value);
  fd.append('level',opt.level);fd.append('style',opt.style);fd.append('focus',$('focus').value);fd.append('jd',$('jd').value);
  $('go').disabled=true;$('go').textContent='Analyzing...';
  try{
    const r=await fetch('/api/analyze',{method:'POST',body:fd});const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Something went wrong.');render(d);
  }catch(e){$('out').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
  $('go').disabled=false;$('go').textContent='Analyze resume';
};
const val=v=>v?esc(v):'<span class="null">Missing</span>';
function ring(s){const r=70,c=2*Math.PI*r,col=s>=80?'#1f9d6b':s>=50?'#e8a317':'#c8553d';
 return `<svg viewBox="0 0 170 170" role="img" aria-label="Completeness ${s} percent"><circle cx="85" cy="85" r="${r}" fill="none" stroke="#e1ece9" stroke-width="14"/><circle cx="85" cy="85" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*s/100} ${c}" transform="rotate(-90 85 85)"/><text x="85" y="92" text-anchor="middle" font-size="34" font-weight="700" fill="#12272a">${s}%</text></svg>`}
let last=null;
function hl(d){let t=esc(d.source_text);const x=d.extracted;
  [x.name,x.email,x.phone,...x.skills].filter(Boolean).sort((a,b)=>b.length-a.length).forEach(v=>{
    const e=esc(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');t=t.replace(new RegExp('(?![^<]*>)('+e+')','gi'),'<mark>$1</mark>')});return t}
function dl(){const {source_text,...o}=last;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='resume_analysis.json';a.click()}
function jm(m){return m?`<div class="card" style="margin-bottom:20px"><h2>Job match: ${m.score}%</h2>
  <div>${m.matched_skills.map(s=>`<span class="chip" style="background:#cdeedd">${esc(s)}</span>`).join('')||'<span class="null">No matching skills</span>'}</div>
  <div style="margin-top:8px">${m.missing_skills.map(s=>`<span class="chip" style="background:#f7d9d2">${esc(s)}</span>`).join('')}</div>
  ${m.advice.length?'<ul class="f" style="margin-top:10px">'+m.advice.map(a=>`<li>${esc(a)}</li>`).join('')+'</ul>':''}</div>`:''}
function render(d){last=d;
  const x=d.extracted,cats=Object.entries(d.skill_categories),max=Math.max(1,...cats.map(c=>c[1].length));
  $('out').innerHTML=`
  <button class="dl" onclick="dl()">Download JSON</button> <small>Schema valid</small>
  ${jm(d.job_match)}
  <div class="grid">
    <div class="card ring"><h2>Completeness</h2>${ring(d.completeness.score)}
      <ul class="chk">${d.completeness.checks.map(c=>`<li><span>${esc(c.field)}</span><span class="${c.present?'yes':'no'}">${c.present?'Found':'Missing'}</span></li>`).join('')}</ul></div>
    <div class="card"><h2>Summary</h2><div class="summary">${esc(d.summary)}</div>
      ${d.key_findings.length?'<h2 style="margin-top:16px">Key findings</h2><ul class="f">'+d.key_findings.map(k=>`<li>${esc(k)}</li>`).join('')+'</ul>':''}</div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><h2>Extracted fields</h2>
      <div class="row"><b>Name</b><span>${val(x.name)}</span></div>
      <div class="row"><b>Email</b><span>${val(x.email)}</span></div>
      <div class="row"><b>Phone</b><span>${val(x.phone)}</span></div>
      <div class="row"><b>Skills</b><span>${x.skills.length?x.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join(''):val(null)}</span></div>
      <div class="row"><b>Education</b><span>${x.education.length?x.education.map(e=>`${val(e.degree)}, ${val(e.institution)} ${e.year?'('+esc(e.year)+')':''}`).join('<br>'):val(null)}</span></div>
      <div class="row"><b>Experience</b><span>${x.experience.length?x.experience.map(e=>`<b style="color:inherit">${val(e.title)}</b> at ${val(e.company)} ${e.duration?'('+esc(e.duration)+')':''}${e.highlights.length?'<ul class="f">'+e.highlights.map(h=>`<li>${esc(h)}</li>`).join('')+'</ul>':''}`).join('<br>'):val(null)}</span></div>
    </div>
    <div class="card"><h2>Skills map</h2>${cats.length?cats.map(([c,l])=>`<div class="bar"><span>${esc(c)}</span><i style="width:${l.length/max*100}%"></i><b>${l.length}</b></div>`).join(''):'<span class="null">No skills found to chart.</span>'}</div>
  </div>
  <div class="card" style="margin-bottom:20px"><h2>Evidence: where each value came from</h2><div class="src">${hl(d)}</div></div>
  ${d.uncertain_fields.length?`<div class="note"><b>Please review:</b> ${d.uncertain_fields.map(esc).join(', ')}</div>`:''}
  ${d.validation_notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}
  ${d.meta.truncated?'<div class="note">Document was long, only the first 20,000 characters were analyzed.</div>':''}`;
}
</script>
</body>
</html>
